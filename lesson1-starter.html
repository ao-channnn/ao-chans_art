<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My First Page</title>

  <!-- 
    LESSON 1: HTML + CSS basics
    ---------------------------
    HTML = the CONTENT of the page (words, images, structure)
    CSS  = the STYLE of the page (colors, fonts, spacing)

    Try this: change the words below, save, and refresh your browser
    to see the change. If you installed the "Live Server" extension
    in VS Code, it'll refresh automatically!
  -->

  <style>
    /* This is CSS. Each rule says: "for this element, use these styles." */

    body {
      background-color: white;   /* TRY CHANGING THIS COLOR */
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    h1 {
      color: rgb(0, 0, 60);            /* TRY CHANGING THIS COLOR TOO */
    }

    p {
      font-size: 18px;
      color: #001e35;
    
    }
    a {
      color: #a7d9e9;
    } 
    img {
      border: 5px solid #00e5ff;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- This is HTML. Each tag says: "this is what kind of content this is." -->

  <h1>Hi, I'm Andi!</h1>

  <p>This is my very first webpage, built completely from scratch.</p>
